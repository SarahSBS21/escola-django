
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Professores</title>
</head>

<body>

    <h1>Formulário de Cadastro de Professores</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <input type="text" name="nome"
                   placeholder="Nome do professor" required>
        </p>

        <p>
            <input type="text" name="disciplina"
                   placeholder="Disciplina" required>
        </p>

        <p>
            <input type="email" name="email"
                   placeholder="Email do professor" required>
        </p>

        <p>
            <input type="text" name="telefone"
                   placeholder="Telefone do professor" required>
        </p>

        <input type="submit" value="Cadastrar">

    </form>

    <p>
        <a href="{% url 'listar_professores' %}">
            Ver professores cadastrados
        </a>
    </p>

</body>

</html>
