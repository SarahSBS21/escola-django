
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
</head>

<body>

    <h1>Formulário de Cadastro de Livros</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <input type="text" name="titulo"
                   placeholder="Título do livro" required>
        </p>

        <p>
            <input type="text" name="autor"
                   placeholder="Nome do autor" required>
        </p>

        <p>
            <input type="text" name="editora"
                   placeholder="Editora" required>
        </p>

        <p>
            <input type="number" name="ano_publicacao"
                   placeholder="Ano de publicação" required>
        </p>

        <p>
            <input type="text" name="isbn"
                   placeholder="ISBN do livro"
                   maxlength="13" required>
        </p>

        <input type="submit" value="Cadastrar">

    </form>

    <p>
        <a href="{% url 'listar_livros' %}">
            Ver livros cadastrados
        </a>
    </p>

</body>

</html>
