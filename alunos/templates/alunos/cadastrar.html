
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>

<body>

    <h1>Formulário de Cadastro de Alunos</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <input type="text" name="nome"
                   placeholder="Nome do aluno" required>
        </p>

        <p>
            <input type="number" name="idade"
                   placeholder="Idade do aluno" required>
        </p>

        <p>
            <input type="email" name="email"
                   placeholder="Email do aluno" required>
        </p>

        <p>
            <input type="text" name="telefone"
                   placeholder="Telefone do aluno" required>
        </p>

        <p>
            <input type="text" name="endereco"
                   placeholder="Endereço do aluno" required>
        </p>
        <p>
            <input type="text" name="matricula"
            placeholder="Matrícula do aluno" required>
        </p>
        <p>
            <input type="text" name="cpf"
            placeholder="CPF do aluno"
            maxlength="11" minlength="11"
            pattern="[0-9]{11}" required>
        </p>

        <input type="submit" value="Cadastrar">

    </form>

</body>

</html>
